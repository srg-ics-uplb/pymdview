# Tool configuration only. pymdview is installed with install.sh or the .deb,
# not with pip, so there is no [project] table here.

[tool.ruff]
line-length = 110
target-version = "py310"  # Ubuntu 22.04
extend-include = ["bin/pymdview"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pymdview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
